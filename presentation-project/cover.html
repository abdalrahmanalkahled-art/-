<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>مدير تسويق مدار</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .slide-container { min-height: 720px; width: 1280px; background: linear-gradient(135deg,#f8fbff 0%,#eef5fd 100%); color:#333333; display:flex; align-items:flex-start; padding-top:56px; padding-right:80px; padding-left:80px; font-family: Arial, sans-serif; }
  .copy { width:60%; padding-left:52px; }
  .accent { width:80px; height:4px; background:#4A90E2; margin-bottom:12px; }
  h1 { color:#4A90E2; font-size:54px; line-height:1.18; margin:0 0 18px; font-weight:800; }
  .subtitle { font-size:25px; line-height:1.5; margin:0; color:#333; max-width:590px; }
  .insight { margin-top:24px; border-right:4px solid #4A90E2; background:#F8F9FA; padding:12px 16px; font-size:17px; line-height:1.6; max-width:560px; }
  .meta { margin-top:40px; color:#666; font-size:14px; }
  .visual { width:40%; display:flex; justify-content:center; align-items:flex-start; }
  .phone { width:270px; height:520px; background:#152238; border:9px solid #152238; border-radius:35px; padding-top:8px; box-shadow:0 18px 42px rgba(36,72,119,.25); overflow:hidden; }
  .phone img { width:100%; height:100%; object-fit:cover; object-position:top; border-radius:22px; }
</style>
</head>
<body>
<div class="slide-container">
  <section class="copy">
    <div class="accent"></div>
    <h1>مدير تسويق<br>مدار</h1>
    <p class="subtitle">منصة محمولة لإدارة وقياس التسويق الميداني، من الزيارة والاستبيان إلى التقرير التنفيذي.</p>
    <div class="insight">عرض موجّه للإدارة يوضح كيف يوحّد التطبيق التنفيذ الميداني والبيانات والتحليل والتقارير في دورة تشغيل واحدة.</div>
    <p class="meta">عرض تنفيذي للإدارة | 2026</p>
  </section>
  <aside class="visual">
    <div class="phone"><img src="/home/ubuntu/madar-marketing-manager/presentation-assets/home-phone.webp" alt="لقطة الشاشة الرئيسية للتطبيق" /></div>
  </aside>
</div>
</body>
</html>
